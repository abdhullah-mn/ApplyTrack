spring.application.name=backend
server.port=${PORT:8080}

# Local PostgreSQL connection. Set DB_URL, DB_USERNAME, and DB_PASSWORD in the environment.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/applytrack_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

app.cors.allowed-origins=${FRONTEND_ORIGIN:http://localhost:5173}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
